<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Pengadaan Server Hosting muslimsolo.id">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e9f6e"/>
      <stop offset="1" stop-color="#057a55"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f4ec"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#04372a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- decorative circles -->
  <circle cx="1110" cy="120" r="180" fill="#ffffff" opacity="0.08"/>
  <circle cx="170" cy="620" r="220" fill="#ffffff" opacity="0.07"/>

  <!-- dotted connection lines -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round">
    <path d="M120 360 H300" fill="none"/>
    <path d="M980 360 H1160" fill="none"/>
  </g>

  <!-- left cloud icon -->
  <g transform="translate(70,300)" fill="#ffffff" opacity="0.9">
    <path d="M70 70 a45 45 0 0 1 88 -12 a32 32 0 0 1 6 64 H78 a36 36 0 0 1 -8 -52 Z"/>
  </g>

  <!-- server rack -->
  <g filter="url(#soft)" transform="translate(470,170)">
    <rect x="0" y="0" width="340" height="380" rx="26" fill="url(#rack)"/>
    <!-- units -->
    <g>
      <rect x="28" y="34" width="284" height="70" rx="14" fill="#0f1b2d" opacity="0.9"/>
      <rect x="28" y="124" width="284" height="70" rx="14" fill="#0f1b2d" opacity="0.9"/>
      <rect x="28" y="214" width="284" height="70" rx="14" fill="#0f1b2d" opacity="0.9"/>
      <rect x="28" y="304" width="284" height="50" rx="14" fill="#0f1b2d" opacity="0.78"/>
    </g>
    <!-- status leds -->
    <g>
      <circle cx="62" cy="69" r="9" fill="#34d399"/>
      <circle cx="92" cy="69" r="9" fill="#fbbf24"/>
      <circle cx="62" cy="159" r="9" fill="#34d399"/>
      <circle cx="92" cy="159" r="9" fill="#34d399"/>
      <circle cx="62" cy="249" r="9" fill="#34d399"/>
      <circle cx="92" cy="249" r="9" fill="#f87171"/>
    </g>
    <!-- vents -->
    <g fill="#ffffff" opacity="0.5">
      <rect x="150" y="58" width="140" height="6" rx="3"/>
      <rect x="150" y="74" width="140" height="6" rx="3"/>
      <rect x="150" y="148" width="140" height="6" rx="3"/>
      <rect x="150" y="164" width="140" height="6" rx="3"/>
      <rect x="150" y="238" width="140" height="6" rx="3"/>
      <rect x="150" y="254" width="140" height="6" rx="3"/>
    </g>
  </g>

  <!-- right gear / uptime icon -->
  <g transform="translate(1040,300)" fill="#ffffff" opacity="0.9">
    <circle cx="40" cy="40" r="40"/>
    <circle cx="40" cy="40" r="18" fill="#057a55"/>
  </g>

  <!-- text -->
  <g fill="#ffffff" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif">
    <text x="640" y="618" text-anchor="middle" font-size="46" font-weight="800">Pengadaan Server Hosting</text>
    <text x="640" y="668" text-anchor="middle" font-size="30" font-weight="600" opacity="0.92">muslimsolo.id &#183; Operasional 1 Tahun</text>
  </g>

  <!-- top-left brand chip -->
  <g transform="translate(70,64)">
    <rect width="246" height="60" rx="30" fill="#ffffff" opacity="0.16"/>
    <circle cx="42" cy="30" r="20" fill="#ffffff"/>
    <text x="42" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#057a55" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif">M</text>
    <text x="78" y="38" font-size="24" font-weight="800" fill="#ffffff" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif">MuslimSolo</text>
  </g>
</svg>
